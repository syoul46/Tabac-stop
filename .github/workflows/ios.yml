## Build iOS — `.ipa` non signé (jalon iOS-C, cf. PLAN.md §17)
##
## Cairn ne passe ni par l'App Store ni par TestFlight. Ce workflow produit un
## `.ipa` **non signé** que l'utilisateur re-signe lui-même avec son Apple ID
## gratuit (Sideloadly / AltStore / SideStore). Le runner macOS est gratuit pour
## un repo public : c'est ce qui permet de builder iOS depuis un poste Linux.
##
## Déclenchement :
##   - push d'un tag `v*`   → build + tentative d'attache à la release du tag
##   - release publiée      → attache l'.ipa à la release qui vient de sortir
##   - manuel               → build seul (ou attache à un tag donné en entrée)
##
## L'artefact est TOUJOURS uploadé sur le run, même quand aucune release
## n'existe : rien ne se perd si l'ordre tag/release est inversé.
##
## Deux jobs indépendants, en parallèle :
##   - `build` : le .ipa distribuable (device arm64, non signé)
##   - `smoke` : jalon iOS-D — on démarre vraiment l'app dans le simulateur et
##     on en ramène des captures d'écran. Sans iPhone dans l'équipe, c'est la
##     seule preuve qu'on a que le binaire fait autre chose que compiler.

name: iOS (.ipa non signé)

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release auquel attacher l'.ipa (vide = build seul)"
        required: false
        default: ''

# Un seul build iOS à la fois par ref : le runner macOS est lent et rare.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # nécessaire pour attacher l'.ipa à une release

env:
  FLUTTER_VERSION: 3.44.8 # aligné sur le poste de dev (Dart 3.12.2)
  COCOAPODS_DISABLE_STATS: 'true'

jobs:
  build:
    # macos-latest = runner ARM avec Xcode récent. À épingler (macos-15, …) le
    # jour où une mise à jour d'image casse le build.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Environnement de build
        run: |
          sw_vers
          xcodebuild -version
          pod --version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version

      - name: Dépendances
        run: flutter pub get

      # Les sorties de codegen sont versionnées, mais on régénère quand même :
      # un .g.dart périmé se verrait ici plutôt que chez un utilisateur.
      - name: Codegen (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # `--no-codesign` : aucun certificat, aucun profil, aucun secret.
      # Sortie : build/ios/iphoneos/Runner.app
      - name: Build iOS (release, sans signature)
        run: flutter build ios --release --no-codesign

      # Un .ipa est un simple zip contenant Payload/<App>.app — rien de plus.
      - name: Empaqueter l'.ipa
        id: package
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          test -d "$app" || { echo "::error::$app introuvable"; exit 1; }

          version="$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)"
          ipa="cairn-${version}-unsigned.ipa"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry "$ipa" Payload
          rm -rf Payload

          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          {
            echo "### 📦 \`$ipa\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Taille | $(du -h "$ipa" | cut -f1) |"
            echo "| SHA-256 | \`$(shasum -a 256 "$ipa" | cut -d' ' -f1)\` |"
            echo ""
            echo "⚠️ Binaire **non signé** et **jamais testé sur appareil réel**"
            echo "(cf. PLAN.md §17.4). À re-signer avec un Apple ID gratuit."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa }}
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error
          retention-days: 90

      # Attache à la release SI elle existe déjà. On n'en crée jamais une :
      # les releases sont écrites à la main (notes + APK), le workflow ne fait
      # que déposer son fichier dans celle qui existe.
      - name: Attacher à la release
        env:
          GH_TOKEN: ${{ github.token }}
          IPA: ${{ steps.package.outputs.ipa }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "Pas de tag visé — l'.ipa reste disponible en artefact du run."
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::La release $TAG n'existe pas encore — l'.ipa reste en artefact. Republie-la (ou relance ce workflow avec le tag) pour l'attacher."
            exit 0
          fi
          gh release upload "$TAG" "$IPA" --clobber
          echo "::notice::$IPA attaché à la release $TAG."

  # ── Jalon iOS-D ────────────────────────────────────────────────────────────
  # « Est-ce que ça démarre ? » — la question à laquelle `build` ne répond pas.
  # Build simulateur (toujours en debug : le simulateur n'accepte pas release),
  # boot, install, lancement, captures d'écran. Échoue si le process meurt ou
  # si une exception Dart remonte au démarrage.
  smoke:
    name: smoke (simulateur iOS)
    runs-on: macos-latest
    # 45 min ne suffisaient pas quand `flutter test` se bloque : le job était
    # coupé avant que le garde-fou de l'étape puisse ramener une capture.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Codegen (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build simulateur
        run: flutter build ios --simulator --debug

      - name: Démarrer un iPhone
        id: sim
        run: |
          set -euo pipefail
          # Les runtimes sont listés par ordre croissant → le dernier iPhone
          # de la liste est celui du runtime iOS le plus récent disponible.
          line="$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | tail -1)"
          udid="$(printf '%s' "$line" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')"
          test -n "$udid" || { echo "::error::Aucun simulateur iPhone disponible"; exit 1; }
          echo "Simulateur retenu : $line"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"

      - name: Installer et lancer Cairn
        id: launch
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app

          # Surtout PAS `launch --console-pty` : il exige un vrai tty, qui
          # n'existe pas en CI — il ne lance rien et ne dit rien. On passe par
          # un flux de logs séparé, et on lance au premier plan pour voir le
          # code de retour.
          xcrun simctl spawn "$UDID" log stream --style compact \
            --predicate 'process == "Runner"' > app.log 2>&1 &
          echo "log_pid=$!" >> "$GITHUB_OUTPUT"
          sleep 3

          # Sortie de la forme « com.syoul.cairn: 12345 » — le pid est celui
          # d'un process de l'hôte, donc `kill -0` marche depuis le runner.
          out="$(xcrun simctl launch --terminate-running-process "$UDID" com.syoul.cairn)"
          echo "$out"
          echo "app_pid=${out##*: }" >> "$GITHUB_OUTPUT"

          sleep 12
          xcrun simctl io "$UDID" screenshot demarrage.png
          sleep 15
          xcrun simctl io "$UDID" screenshot stabilise.png

      - name: Verdict
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          APP_PID: ${{ steps.launch.outputs.app_pid }}
          LOG_PID: ${{ steps.launch.outputs.log_pid }}
        run: |
          set -uo pipefail
          fail=0

          # Le flux `log stream` peut avoir pris du retard : on récupère aussi
          # l'historique complet, seul endroit où une erreur dyld apparaîtra.
          kill "$LOG_PID" 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "Runner"' > app-complet.log 2>&1 || true

          if [ -n "$APP_PID" ] && kill -0 "$APP_PID" 2>/dev/null; then
            echo "✅ Cairn (pid $APP_PID) est vivant après 27 s."
          else
            echo "::error::Cairn (pid '$APP_PID') n'est plus vivant — plantage au démarrage."
            ls -1 "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -20 || true
            tail -40 app-complet.log 2>/dev/null || true
            fail=1
          fi

          if grep -qiE "Unhandled Exception|Failed assertion|SQLITE_|DatabaseException" app.log 2>/dev/null; then
            echo "::error::Erreur Dart au démarrage :"
            grep -iE -A5 "Unhandled Exception|Failed assertion|SQLITE_|DatabaseException" app.log | head -40
            fail=1
          fi

          {
            echo "### 📱 Smoke test simulateur"
            echo ""
            echo "Captures : \`demarrage.png\` (12 s) et \`stabilise.png\` (27 s) dans les artefacts."
            echo ""
            echo '```'
            tail -30 app-complet.log 2>/dev/null || echo "(aucune sortie)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $fail

      # `build` + `Verdict` prouvent que l'app démarre. Ici on la **touche** :
      # taper le galet (aller-retour drift/SQLite) puis déclencher la demande
      # de permission de notification. Le dialogue système vit hors de l'arbre
      # Flutter, donc invisible pour le test — d'où la boucle de captures en
      # parallèle, seule façon d'en ramener la preuve.
      - name: Parcours guidé (integration_test)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          xcrun simctl terminate "$UDID" com.syoul.cairn 2>/dev/null || true
          mkdir -p captures

          # `flutter test` se fige parfois après un build réussi, test host
          # bloqué sur le splash (~1 run sur 3, cf. PLAN §17.4 — cause inconnue,
          # sans rapport avec le Podfile malgré une fausse piste). D'où le
          # garde-fou, puis une seconde tentative après reboot du simulateur.
          run_test() {
            local tag="$1"
            rm -f integration.log
            flutter test integration_test/parcours_test.dart -d "$UDID" --timeout 5x \
              > integration.log 2>&1 &
            local pid=$!
            local i=0 rc=""
            while kill -0 "$pid" 2>/dev/null; do
              i=$((i + 1))
              xcrun simctl io "$UDID" screenshot \
                "$(printf 'captures/%s-%03d.png' "$tag" "$i")" >/dev/null 2>&1 || true
              if [ "$i" -gt 96 ]; then   # 96 × 5 s = 8 min, très large
                echo "::warning::$tag : bloqué depuis 8 min, on coupe."
                kill -9 "$pid" 2>/dev/null || true
                rc=124
                break
              fi
              sleep 5
            done
            [ -z "$rc" ] && { wait "$pid"; rc=$?; }
            cat integration.log
            return $rc
          }

          rc=0
          if ! run_test essai1; then
            echo "::warning::Première tentative en échec — on relance sur un simulateur neuf."
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
            run_test essai2 || rc=$?
          fi

          # L'essentiel des frames est identique : on ne garde que les changements.
          prev=""
          for f in captures/*.png; do
            h="$(md5 -q "$f")"
            if [ "$h" = "$prev" ]; then rm -f "$f"; else prev="$h"; fi
          done
          echo "Captures conservées : $(ls -1 captures | wc -l)"
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-simulateur
          path: |
            demarrage.png
            stabilise.png
            captures/
            integration.log
            app.log
            app-complet.log
          if-no-files-found: warn
          retention-days: 30
